name: Isolated Cloudflare compatibility

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-coverage:
    name: Tests and coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .node-version
      - name: Materialize locked public dependencies without lifecycle scripts
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pnpm-tool"
          npm install --prefix "$RUNNER_TEMP/pnpm-tool" pnpm@8.15.9 --ignore-scripts --no-audit --no-fund
          node "$RUNNER_TEMP/pnpm-tool/node_modules/pnpm/bin/pnpm.cjs" install --frozen-lockfile --ignore-scripts --reporter=append-only
          node "$RUNNER_TEMP/pnpm-tool/node_modules/pnpm/bin/pnpm.cjs" list wrangler miniflare workerd undici --depth Infinity
          mkdir -p "$RUNNER_TEMP/cf-source"
          git archive HEAD | tar -x -C "$RUNNER_TEMP/cf-source"
          find "$RUNNER_TEMP/cf-source" \( -type f -o -type l \) \( -name '.env' -o -name '.env.*' -o -name '.dev.vars' -o -name '.dev.vars.*' -o -name '.npmrc' \) -delete
          cp -R node_modules "$RUNNER_TEMP/cf-source/node_modules"
      - name: Prepare disposable isolated runner
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/cf-runner"
          cp -R "$RUNNER_TEMP/pnpm-tool/node_modules/pnpm" "$RUNNER_TEMP/cf-runner/pnpm"
          mkdir -p "$RUNNER_TEMP/cf-runner/bin"
          printf '#!/bin/sh\nexec node /harness/pnpm/bin/pnpm.cjs "$@"\n' > "$RUNNER_TEMP/cf-runner/bin/pnpm"
          chmod 755 "$RUNNER_TEMP/cf-runner/bin/pnpm"
          cat > "$RUNNER_TEMP/cf-runner/Dockerfile" <<'DOCKERFILE'
          FROM node:22.23.4-bookworm
          RUN apt-get update && apt-get install -y --no-install-recommends chromium && rm -rf /var/lib/apt/lists/*
          RUN printf '#!/bin/sh\nexec /usr/bin/chromium --no-sandbox --disable-dev-shm-usage "$@"\n' > /usr/local/bin/ci-chromium && chmod 755 /usr/local/bin/ci-chromium
          DOCKERFILE
          docker build --pull -t cloudflare-validation "$RUNNER_TEMP/cf-runner"
          cat > "$RUNNER_TEMP/cf-runner/run.sh" <<'SCRIPT'
          #!/bin/bash
          set -euo pipefail
          mkdir -p /scratch/home /scratch/tmp /scratch/project
          cp -R /src/. /scratch/project/
          cd /scratch/project
          rm -rf .git
          node --version
          pnpm --version
          pnpm exec wrangler --version
          pnpm list wrangler miniflare workerd undici --depth Infinity
          pnpm run check
          pnpm exec wrangler types /scratch/homepage-env.d.ts
          pnpm exec wrangler types /scratch/analytics-env.d.ts --config workers/share-analytics/wrangler.jsonc
          pnpm exec wrangler d1 migrations apply douban-book-plus-feedback --local --persist-to /scratch/project/.wrangler/state
          node /harness/check-runtime.mjs
          echo 'VALIDATION: all checks passed'
          SCRIPT
          cat > "$RUNNER_TEMP/cf-runner/check-runtime.mjs" <<'JAVASCRIPT'
          import assert from 'node:assert/strict';
          import { spawn } from 'node:child_process';
          import { setTimeout as delay } from 'node:timers/promises';
          async function server(label, args, url, check) {
            const child=spawn(process.execPath,args,{stdio:['ignore','pipe','pipe']});
            let log='';
            for(const stream of [child.stdout,child.stderr]) stream.on('data',b=>{log=(log+b).slice(-16000)});
            try {
              let response;
              for(let i=0;i<120;i++) {
                if(child.exitCode!==null) throw new Error(label+' exited: '+log);
                try { response=await fetch(url,{signal:AbortSignal.timeout(3000)});break; }
                catch { await delay(500); }
              }
              assert.ok(response,label+' not ready: '+log);
              await check(response);
              console.log('PASS '+label);
            } catch(error) { console.error(log);throw error; }
            finally {
              child.kill('SIGTERM');
              if(child.exitCode===null) await Promise.race([new Promise(r=>child.once('exit',r)),delay(3000)]);
              if(child.exitCode===null) child.kill('SIGKILL');
            }
          }
          const json=async(r,status)=>{assert.equal(r.status,status,await r.clone().text());return r.json();};

          await server('homepage Pages Functions and static output',
            ['node_modules/wrangler/bin/wrangler.js','pages','dev','docs/.vitepress/dist','--ip','127.0.0.1','--port','4666','--persist-to','/scratch/project/.wrangler/state','--inspector-port','0'],
            'http://127.0.0.1:4666/api/feedback',async r=>{
              assert.deepEqual(await json(r,200),{enabled:false});
              const post=await fetch('http://127.0.0.1:4666/api/uninstall-responses',{method:'POST',headers:{Origin:'https://untrusted.invalid','Content-Type':'application/json'},body:'{}'});
              assert.equal(post.status,403);
              const page=await fetch('http://127.0.0.1:4666/');assert.equal(page.status,200);assert.match(await page.text(),/<html/i);
            });
          await server('analytics Worker and local D1 binding',
            ['node_modules/wrangler/bin/wrangler.js','dev','--config','workers/share-analytics/wrangler.jsonc','--persist-to','/scratch/project/.wrangler/state','--local','--ip','127.0.0.1','--port','4667','--inspector-port','0'],
            'http://127.0.0.1:4667/api/extension-store-stats',async r=>{
              const body=await json(r,200);assert.deepEqual(body.stores,[]);
              const batch={version:1,batchId:'00000000-0000-4000-8000-000000000002',events:[{day:new Date().toISOString().slice(0,10),event:'share_referral_opened',count:1}]};
              for(let i=0;i<2;i++){
                const saved=await fetch('http://127.0.0.1:4667/api/share-analytics',{method:'POST',headers:{Origin:'http://127.0.0.1:4667','Content-Type':'application/json'},body:JSON.stringify(batch)});
                assert.deepEqual(await json(saved,202),{saved:true});
              }
              const reject=await fetch('http://127.0.0.1:4667/api/share-analytics',{method:'POST',headers:{Origin:'https://untrusted.invalid','Content-Type':'application/json'},body:'{}'});
              assert.equal(reject.status,403);
            });
          JAVASCRIPT
          cat > "$RUNNER_TEMP/cf-runner/forward.py" <<'PYTHON'
          import subprocess, sys, secrets
          token = secrets.token_hex(32)
          print('::stop-commands::' + token, flush=True)
          p = subprocess.Popen(['docker', 'start', '-a', sys.argv[1]], stdout=subprocess.PIPE, stderr=subprocess.STDOUT)
          total = 0
          while True:
              block = p.stdout.read1(16384)
              if not block: break
              total += len(block)
              if total > 4 * 1024 * 1024:
                  subprocess.run(['docker', 'kill', sys.argv[1]], stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)
                  raise SystemExit('Validation exceeded its 4 MiB output limit')
              sys.stdout.buffer.write(block)
              sys.stdout.buffer.flush()
          code = p.wait()
          print('\n::' + token + '::', flush=True)
          raise SystemExit(code)
          PYTHON
      - name: Validate without external network, credentials or writable host access
        run: |
          set -euo pipefail
          # Every file exposed to target code is a read-only bind or a bounded tmpfs copy.
          cid=$(docker create --init --network none --read-only --ipc none --log-driver none \
            --user 1000:1000 --cap-drop ALL --security-opt no-new-privileges \
            --memory 6g --memory-swap 6g --cpus 2 --pids-limit 256 \
            --ulimit core=0:0 --ulimit nofile=4096:4096 --ulimit fsize=536870912:536870912 --ulimit cpu=900:900 \
            --tmpfs /scratch:rw,exec,nosuid,nodev,size=3g,uid=1000,gid=1000,mode=0700 \
            --mount "type=bind,src=$RUNNER_TEMP/cf-source,dst=/src,readonly" \
            --mount "type=bind,src=$RUNNER_TEMP/cf-runner,dst=/harness,readonly" \
            --entrypoint /usr/bin/env cloudflare-validation -i \
            PATH=/harness/bin:/usr/local/bin:/usr/bin:/bin HOME=/scratch/home TMPDIR=/scratch/tmp \
            CI=1 LANG=C.UTF-8 NODE_OPTIONS=--max-old-space-size=3072 \
            BROWSER_PATH=/usr/local/bin/ci-chromium CLOUDFLARE_CF_FETCH_ENABLED=false \
            WRANGLER_SEND_METRICS=false WRANGLER_WRITE_LOGS=false \
            /bin/bash /harness/run.sh)
          trap 'docker rm -f "$cid" >/dev/null 2>&1 || true' EXIT
          docker image inspect cloudflare-validation --format '{{.Id}} {{json .RepoDigests}}'
          docker inspect "$cid" --format '{{json .HostConfig}}'
          timeout --signal=TERM --kill-after=10s 1200s python3 "$RUNNER_TEMP/cf-runner/forward.py" "$cid"
          docker inspect "$cid" --format '{{json .State}}'
          test "$(docker inspect "$cid" --format '{{.State.ExitCode}}')" = 0
